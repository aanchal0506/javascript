<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur Code</title>
</head>
<body style="background-color: black; color: white">
    <ul class="language">
        <li>JavaScript</li>
    </ul>
</body>
<script>
    function AddLanguage(languageName){
       const list = document.createElement('li')
       list.innerHTML = `${languageName}`
       document.querySelector('.language').appendChild(list)
    }
    AddLanguage("Python")
    AddLanguage("TypeScript")

    function addOptimisedLanguage(languageName){
        const list = document.createElement('li');
        list.appendChild(document.createTextNode(languageName))
        document.querySelector('.language').appendChild(list)
    }
    addOptimisedLanguage("GoLang")

    //edit 
    const firstLang = document.querySelector("li:nth-child(1)")
    //firstLang.innerHTML = "Mojo"//overwrite
    const newlist = document.createElement('li')
    newlist.textContent = "Mojo"
    //firstLang.replaceWith(newlist)

    const secondLang = document.querySelector('li:nth-child(2)')
    //secondLang.outerHTML="<li>TypeScript</li>"

    //remove
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()

</script>
</html>
